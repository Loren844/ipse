# The desktop app updates itself (issue #156): an old version finds the new one in a
# manifest served on the runner, verifies its signature with a key made for the test,
# and replaces its own AppImage (.github/scripts/update_test.sh).
name: App update

on:
  pull_request:
    paths:
      - .github/workflows/app-update.yml
      - .github/scripts/update_test.sh
      - app/**
  push:
    branches: [main]
    paths:
      - app/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-update-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  update:
    name: An old version updates itself (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb libfuse2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: update
          workspaces: |
            .
            app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: .github/scripts/update_test.sh
