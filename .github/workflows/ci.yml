name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# The Rust version comes from rust-toolchain.toml: rustup installs it on first use.
jobs:
  lint:
    name: Format, lints, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: The app has the same version as the rest
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          app=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -n 1)
          conf=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' app/tauri.conf.json)
          echo "Cargo.toml $version, app/Cargo.toml $app, app/tauri.conf.json $conf"
          [ "$version" = "$app" ] && [ "$version" = "$conf" ] || { echo "Set the same version in Cargo.toml, app/Cargo.toml and app/tauri.conf.json."; exit 1; }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Milestone 1 scenario time
        run: cargo test -p ipse --test milestone1 -- --nocapture
      - name: Milestone 2 scenario time
        run: cargo test -p ipse --test milestone2 -- --nocapture

  bench:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run

  app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, with the update test's feature
        run: cargo clippy --all-targets --features update-test -- -D warnings
      - run: cargo test
      - run: cargo build
      - name: The app opens a memory
        if: runner.os == 'Linux'
        run: |
          (cd .. && cargo build -p ipse)
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          ../target/debug/ipse init "$HOME/Ipse demo" --demo --language fr --time-zone Europe/Paris
          mkdir -p "$XDG_CONFIG_HOME/io.github.loren844.ipse"
          printf '{"folder": "%s"}' "$HOME/Ipse demo" > "$XDG_CONFIG_HOME/io.github.loren844.ipse/memory.json"
          xvfb-run -a ./target/debug/ipse-app &
          for i in $(seq 1 60); do pgrep -f "ipse ui --app" && break; sleep 1; done
          pgrep -f "ipse ui --app" || { echo "The app did not start ipse ui."; exit 1; }
          pkill -f target/debug/ipse-app
          for i in $(seq 1 20); do pgrep -f "ipse ui --app" || exit 0; sleep 1; done
          echo "ipse ui outlived the app."; exit 1

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - name: The committed build matches the sources
        working-directory: ui
        run: |
          npm run build
          test -z "$(git status --porcelain -- build)" || { git status --porcelain -- build; echo "Run npm run build in ui/ and commit ui/build."; exit 1; }
      - name: The TypeScript types match the Rust ones
        run: |
          cargo test -p ipse --bin ipse
          test -z "$(git status --porcelain -- ui/src/lib/types)" || { git status --porcelain -- ui/src/lib/types; echo "Run cargo test -p ipse and commit ui/src/lib/types."; exit 1; }
      - run: cargo build -p ipse
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: In a real browser
        run: npx playwright test
        working-directory: ui
