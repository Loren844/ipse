# Keeps the pinned actions and the dependencies up to date (issue #285): one pull
# request a week per ecosystem, grouped. The release workflow is generated by
# cargo-dist: when a bump touches release.yml, put the same commits in
# dist-workspace.toml and run `dist generate`, or its check fails.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories: ["/", "/app"]
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      packages:
        update-types: ["minor", "patch"]
