[package]
name = "ipse"
description = "Ipse: your memory, on your machine, for any AI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ipse"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
ipse-core = { workspace = true }
ipse-protocol = { workspace = true }
jiff = { workspace = true }
keyring = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "process"] }

[[bench]]
name = "calendar"
harness = false

[lints]
workspace = true
