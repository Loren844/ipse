[package]
name = "ipse"
description = "Ipse: your memory, on your machine, for any AI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ipse"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
ipse-core = { workspace = true }
ipse-protocol = { workspace = true }
jiff = { workspace = true }
keyring = { workspace = true }
notify = { workspace = true }
quick-xml = { workspace = true }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
ureq = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# TypeScript types of the interface's API, written to ui/src/lib/types by `cargo test`.
ts-rs = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "process"] }

[[bench]]
name = "app_start"
harness = false

[[bench]]
name = "calendar"
harness = false

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "contacts"
harness = false

[[bench]]
name = "mcp_transport"
harness = false

[[bench]]
name = "timeline"
harness = false

[lints]
workspace = true
