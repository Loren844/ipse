[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Loren844/ipse"
authors = ["Ipse contributors"]

[workspace.dependencies]
blake3 = "1.8"
ipse-core = { path = "crates/ipse-core" }
ipse-protocol = { path = "crates/ipse-protocol" }
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
# HTTP/1 server for MCP over Streamable HTTP on 127.0.0.1 (rmcp gives the MCP side).
http-body-util = "0.1"
hyper = { version = "1.7", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Git in pure Rust, for the vault's history (docs/spec/vault.md, section 9).
gix = { version = "0.90", default-features = false, features = ["excludes", "index", "sha1"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
jiff = { version = "0.2", features = ["serde"] }
# Compact binary form of the saved search index (.ipse/index/).
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# The system keychain: Keychain on macOS, Credential Manager on Windows, Secret Service on Linux.
keyring = "4.2"
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io"] }
saphyr-parser = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.48", default-features = false, features = ["rt"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
ulid = "3.0"
# HTTP for connectors that fetch a link, with rustls (no OpenSSL).
ureq = "3.5"

# One lint policy for every crate. Each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"            # allowed locally only with a `// SAFETY:` comment and a benchmark that justifies it
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
unwrap_used = "deny"            # no panics on bad input: return errors
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"           # the core library never prints; binaries opt out locally

# Release builds are tuned for speed and size.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Benchmarks measure release-grade code.
[profile.bench]
inherits = "release"
debug = true
strip = false
